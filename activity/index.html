<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to me</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1230; color: #fff;
    font-family: system-ui, sans-serif; display: flex; align-items: center;
    justify-content: center; text-align: center; }
  button { font-size: 1.1rem; padding: .7rem 1.4rem; border: 0; border-radius: 999px;
    background: #f6d860; color: #1a1f4d; cursor: pointer; margin-top: 1rem; }
  small { opacity: .7; }
</style>
</head>
<body>
<main>
  <h2 id="title">Return to me</h2>
  <small id="status">Playing on loop. Keep this open and browse Discord.</small><br>
  <button id="toggle" hidden>Play</button>
</main>
<script src="sdk.js"></script>
<script>
  const status = document.getElementById("status");
  const toggle = document.getElementById("toggle");
  // Web Audio loops an uncompressed buffer, so there is no gap at the loop point.
  const context = new (window.AudioContext || window.webkitAudioContext)();
  let buffer = null;
  let source = null;

  const loaded = fetch("return_to_me.wav")
    .then((response) => response.arrayBuffer())
    .then((data) => context.decodeAudioData(data))
    .then((decoded) => { buffer = decoded; });

  function showButton(text) {
    toggle.textContent = text;
    toggle.hidden = false;
  }

  async function start() {
    // Mobile browsers only allow resume() synchronously inside the tap, so call it before awaiting.
    const resumed = context.resume();
    await loaded;
    await resumed;
    if (context.state !== "running") throw new Error("blocked");
    if (source) return;
    source = context.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    source.connect(context.destination);
    source.start();
    status.textContent = "Playing on loop. Keep this open and browse Discord.";
    showButton("Pause");
  }

  toggle.addEventListener("click", async () => {
    if (source) {
      source.stop();
      source = null;
      status.textContent = "Paused.";
      showButton("Play");
    } else {
      try { await start(); } catch (error) {
        console.error(error);
        status.textContent = "Could not play audio: " + error.message;
      }
    }
  });

  (async () => {
    try {
      const sdk = new window.DiscordSDK("__CLIENT_ID__");
      await sdk.ready();
    } catch (error) {
      console.error("Discord SDK failed", error);
    }
    try {
      await start();
    } catch (error) {
      status.textContent = "Press play to start the song.";
      showButton("Play");
    }
  })();
</script>
</body>
</html>
